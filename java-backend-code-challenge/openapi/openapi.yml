      GetProductResponse:
        description: Product Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
            examples:
              ExampleOne:
                value:
                  id: cecc2fc3-dbbf-4d27-accb-667e70bd3812
                  name: 'Guitar'
