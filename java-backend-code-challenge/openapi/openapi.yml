                  created_on: '2021-01-01T00:00:00Z'
      GetInvoicesResponse:
        description: Invoices page response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceResponsePage'
            examples:
              ExampleOne:
                value:
