                        created_on: '2021-01-01T00:00:00Z'
                      quantity: 4

    parameters:
      UserIdParameter:
        in: path
        name: user-id
        description: User identifier
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      ProductIdParameter:
        in: path
        name: product-id
        description: Product identifier
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      PageNumberParameter:
        in: query
        required: false
        name: page
        schema:
          $ref: '#/components/schemas/PageNumber'
      PageSizeParameter:
        in: query
        required: false
        name: size
        schema:
          $ref: '#/components/schemas/PageSize'
      InvoiceIdParameter:
        name: invoice-id
        in: path
        description: ID of the invoice to retrieve
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      CartIdParameter:
        in: path
        name: cart-id
        description: Cart identifier
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      quantity:
        in: query
        name: quantity
        description: Number of products to add to the cart. If not provided, defaults to 1.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1

    requestBodies:
      CreateProductRequest:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductCommand'
      SaveProductRequest:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProductCommand'
      UpdateProductRequest:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductCommand'
      UpdateProductStatusRequest:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductStatusCommand'

    schemas:
      ProductStatus:
        type: string
        enum:
          - IN_STOCK
          - SOLD_OUT
          - DISCONTINUED
        example: IN_STOCK
      SaveProductCommand:
        type: object
        description: SaveProductCommand
        required:
          - userId
          - productId
          - name
          - description
          - price
        properties:
          userId:
            $ref: '#/components/schemas/Identifier'
          productId:
            $ref: '#/components/schemas/Identifier'
          name:
            type: string
            description: Name of the product
          description:
            type: string
            description: Description of the product
          price:
            type: number
            format: float
            description: Price of the product
        additionalProperties: false
        example:
          userId: 217742d7-827f-4fc1-b649-f59539dd65b9
          productId: 5b6f1e9d-1b7d-4b6d-8b8e-6b4b3e3b3b3b
          name: Example Product
          description: This is an example product
          price: 100.00
      CreateProductCommand:
        type: object
        description: SaveProductCommand
        required:
          - name
          - description
          - price
        properties:
          productId:
            $ref: '#/components/schemas/Identifier'
          name:
            type: string
            description: Name of the product
          description:
            type: string
            description: Description of the product
          price:
            type: number
            format: float
            description: Price of the product
        additionalProperties: false
        example:
          name: Example Product
          description: This is an example product
          price: 100.00
      PageNumber:
        type: integer
        minimum: 0
        maximum: 1024
        format: int32
        default: 0
      PageSize:
        type: integer
        minimum: 10
        maximum: 2000
        format: int32
        default: 10
      Identifier:
        description: Unique identifier
        type: string
        format: uuid
        example: 18368bf6-9d7a-4d42-a1e1-57ee41337393
      PagingData:
        description: Paging response data
        type: object
        required:
          - totalElements
          - totalPages
        properties:
          totalElements:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
        example:
          totalPages: 1
          totalElements: 2
      Product:
        type: object
        description: Product
        required:
          - id
          - name
          - description
          - status
          - created_on
          - price
        properties:
          id:
            $ref: '#/components/schemas/Identifier'
          name:
            type: string
          description:
            type: string
          status:
            $ref: '#/components/schemas/ProductStatus'
          created_on:
            type: string
            format: 'date-time'
          price:
            type: number
            format: float
            description: Price of the product
        additionalProperties: false
        example:
          id: 217742d7-827f-4fc1-b649-f59539dd65b9
          name: Guitar
          description: A high-quality guitar made from mahogany and spruce.
          status: IN_STOCK
          created_on: '2024-04-16T10:00:00Z'
          price: 1200.00
      Invoice:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/Identifier'
          userId:
            $ref: '#/components/schemas/Identifier'
          items:
            type: array
            items:
              $ref: '#/components/schemas/Item'
          createdOn:
            type: string
            format: date-time
            description: The date and time when the invoice was created
          totalPrice:
            type: number
            format: float
            description: Total price of the invoice
        required:
          - id
          - userId
          - createdOn
          - totalPrice
        example:
          id: 217742d7-827f-4fc1-b649-f59539dd65b9
          userId: 3b3b3b3b-3b3b-3b3b-3b3b-3b3b3b3b3b3b
          items:
            - product:
                id: 4b3b4b3b-4b3b-4b3b-4b3b-4b3b4b3b4b3b
                name: Guitar
                description: A high-quality guitar made from mahogany and spruce.
                status: IN_STOCK
                created_on: '2024-04-16T10:00:00Z'
                price: 1200.00
              quantity: 2
          createdOn: '2024-04-16T10:00:00Z'
          totalPrice: 2499.99
      UpdateProductCommand:
        description: >-
          Command to update a product, with partial update support.
          Supporting partial updates means no fields are required. If a field is not provided, it is
          left "as-is" in the update.
          Also note that fields which can be set to null, must be flagged as nullable to distinguish
          between the field being absent and the field being null.
        properties:
          name:
            type: string
          description:
            type: string
            nullable: true
        additionalProperties: false
        example:
          name: John Doe
          description: Dolor sit amet
      UpdateProductStatusCommand:
        description: >-
          Command to update the status of a product.
        required:
          - status
        properties:
          status:
            $ref: '#/components/schemas/ProductStatus'
        additionalProperties: false
        example:
          status: SOLD_OUT
      ProductResponsePage:
        description: Product page response
        type: object
        required:
          - items
          - paging
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Product'
          paging:
            $ref: '#/components/schemas/PagingData'
      InvoiceResponsePage:
        description: Product page response
        type: object
        required:
          - items
          - paging
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Invoice'
          paging:
            $ref: '#/components/schemas/PagingData'
      Item:
        type: object
        properties:
          product:
            $ref: '#/components/schemas/Product'
          quantity:
            type: integer
            format: int32
        required:
          - product
          - quantity
        example:
          product:
            id: 217742d7-827f-4fc1-b649-f59539dd65b9
            name: Guitar
            description: A high-quality guitar made from mahogany and spruce.
            status: IN_STOCK
            created_on: '2024-04-16T10:00:00Z'
            price: 1200.00
          quantity: 2
      Cart:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/Identifier'
          userId:
            $ref: '#/components/schemas/Identifier'
          items:
            type: array
            items:
              $ref: '#/components/schemas/Item'
        required:
          - id
          - userId
          - items
        example:
          id: 217742d7-827f-4fc1-b649-f59539dd65b9
          userId: 217742d7-827f-4fc1-b649-f59539dd65b9
          items:
            - product:
                id: 4b3b4b3b-4b3b-4b3b-4b3b-4b3b4b3b4b3b
                name: Guitar
                description: A high-quality guitar made from mahogany and spruce.
                status: IN_STOCK
                created_on: '2024-04-16T10:00:00Z'
                price: 1200.00
              quantity: 2
      ErrorResponse:
        type: object
        description: >-
          Data structure to show the error produced.
          Error message must always provided.
          Error code may be provided to help API clients identify and take actions on different
          errors. Note that in this case a list of error codes must be documented.
        required:
          - message
        properties:
          code:
            type: string
            description: Error code
            example: internal-error
          message:
            type: string
            description: Error message description
            example: An unexpected error ocurred
        additionalProperties: false