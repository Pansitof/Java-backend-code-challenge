      GetCartResponse:
        description: Cart Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart'
            examples:
              ExampleOne:
                value:
                  id: 7fc0c407-2b98-4af3-8319-ff004c194523
                  userId: 9f924802-b792-4201-8faa-096c1eee1155
                  items:
