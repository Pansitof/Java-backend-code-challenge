                  paging:
                    totalElements: 2
                    totalPages: 1
      GetInvoiceResponse:
        description: Invoice Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
            examples:
              ExampleOne:
                value:
                  id: 5a3ab65d-9a2c-4aeb-a99c-adf8783d2f7a
                  userId: 6305854d-df8e-4a86-a3f9-e69d06a58e63
                  products:
                    - id: 61c54734-9281-4aa0-9e69-4c49ca49150b
