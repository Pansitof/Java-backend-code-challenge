openapi: 3.0.3
info:
  description: |
    Realizando pruebas sobre OpenAPI para el proyecto: java-backend-code-challenge para la tecnología 
    de Spring boot APIRest.
  version: 0.0.1
  title: API Rest
  contact:
    email: francisco.dominguez@training.agiletv.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: 'http://localhost:8080'
    description: LOCAL development environment
tags:
  - name: user
    description: >-
      Los usuarios de la aplicación.
paths:
  /api/users/:
    get:
      tags:
        - user
      description: Operation to get the list of users.
      summary: Get all users
      operationId: getUsers
      parameters:
        - $ref: '#/components/parameters/PageNumberParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          $ref: '#/components/responses/GetProductsResponse'
        '400':
          $ref: '#/components/responses/400Response'
        '401':
          $ref: '#/components/responses/401Response'
        '403':
          $ref: '#/components/responses/403Response'
        '404':
          $ref: '#/components/responses/404Response'
        '405':
          $ref: '#/components/responses/405Response'
        '406':
          $ref: '#/components/responses/406Response'
        '429':
          $ref: '#/components/responses/429Response'
        '500':
          $ref: '#/components/responses/500Response'
        default:
          $ref: '#/components/responses/ErrorResponse'
      security:
        [ ]
components:
    securitySchemes:
      dev_auth:
        type: oauth2
        description: Use this for dev environment
        flows:
          authorizationCode:
            authorizationUrl: >-
              https://keycloak.agile.int/auth/realms/agiletv/protocol/openid-connect/auth
            tokenUrl: >-
              https://keycloak.agile.int/auth/realms/agiletv/protocol/openid-connect/token
            scopes:
              write: modify
              read: read
      pre-env_auth:
        type: oauth2
        description: Use this for pre-production environment
        flows:
          authorizationCode:
            authorizationUrl: >-
              https://preagiletv.cloud-iam.com/auth/realms/agiletv/protocol/openid-connect/auth
            tokenUrl: >-
              https://preagiletv.cloud-iam.com/auth/realms/agiletv/protocol/openid-connect/token
            scopes:
              write: modify
              read: read
      pro-env_auth:
        type: oauth2
        description: Use this for production environment
        flows:
          authorizationCode:
            authorizationUrl: >-
              https://agiletv.cloud-iam.com/auth/realms/agiletv/protocol/openid-connect/auth
            tokenUrl: >-
              https://agiletv.cloud-iam.com/auth/realms/agiletv/protocol/openid-connect/token
            scopes:
              write: modify
              read: read
      basic_auth:
        type: http
        description: Use this for basic authentication
        scheme: basic
    responses:
      204Response:
        description: No content
      400Response:
        description: Bad request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      401Response:
        description: Unauthorized
      403Response:
        description: Forbidden
      404Response:
        description: Not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      405Response:
        description: Method not allowed
      406Response:
        description: Not Acceptable
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      418Response:
        description: I'm a teapot
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      429Response:
        description: Too Many Requests
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      500Response:
        description: Internal Server Error
      ErrorResponse:
        description: An Error Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      GetProductsResponse:
        description: Products page
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductResponsePage'
            examples:
              ExampleOne:
                value:
                  items:
                    - id: 9f720d99-41ee-4476-85ab-bf19a2f49d40
                      name: Guitar
                      description: Bass but with 6 strings
                      price: 100.0
