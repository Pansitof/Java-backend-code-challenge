                  paging:
                    totalElements: 2
                    totalPages: 1
              ExampleTwo:
                value:
                  items:
                    - id: 7f8fd1e1-2e6c-431f-994d-520e82f09342
                      name: Piano
                      description: Spinnet piano
                      price: 300.0
                      status: 'IN_STOCK'
                      created_on: '2021-01-01T00:00:00Z'
                    - id: 231a71c4-d5ee-45ea-861e-dbf24b4f2417
