                      userId: ac68e60d-65c3-401e-a264-284c8f905f24
                      items:
                        - product:
                            id: 735d82d0-1f9e-4355-975c-23ad23a17d93
                            name: 'Trumpet'
                            description: 'Miles Davis trumpet'
                            price: 100.0
                            status: 'IN_STOCK'
                            created_on: '2021-01-01T00:00:00Z'
