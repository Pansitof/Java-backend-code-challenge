                      createdOn: '2021-01-01T00:00:00Z'
                  totalPrice: 300.0
                  createdOn: '2021-01-01T00:00:00Z'
              ExampleTwo:
                value:
                  id: 46cfb283-48c2-4b45-8df4-f3cfd1130d65
                  userId: e9fa1e36-a50e-4440-98a8-4b4da8f0744e
